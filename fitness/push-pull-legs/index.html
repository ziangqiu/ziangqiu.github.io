<p>Push（推）、Pull（拉）、Legs（腿）把动作按发力方向分组，每周循环 2 次就很充实。</p>
<h2 id="示例安排">示例安排</h2>
<ul>
<li><strong>Push</strong>：卧推、肩推、三头下压</li>
<li><strong>Pull</strong>：引体（或高位下拉）、划船、二头弯举</li>
<li><strong>Legs</strong>：深蹲、硬拉、箭步蹲</li>
</ul>
<h2 id="建议">建议</h2>
<p>每个动作 3 组、每组 8–12 次，循序渐进加重。本文为占位示例，正式内容等你来填。</p> <div class="skills" style="margin-top:28px"> <span class="skill">#训练计划</span><span class="skill">#新手</span> </div> </article> </div> </section>  </main> <footer class="footer"> <div class="container footer-inner"> <span>© 2026 我的个人网站. 保留所有权利。</span> <div class="footer-social"> <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a><a href="mailto:you@example.com" target="_blank" rel="noopener">邮箱</a> </div> </div> </footer> </body></html>
