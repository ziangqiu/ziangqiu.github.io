<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vancouver KOM · 温哥华骑行顺风助手</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=20260810092927" />
  <link rel="stylesheet" href="css/styles.css?v=20260810092927" />
  <link rel="stylesheet" href="css/map-style.css?v=20260810092927" />
</head>
<body>
  <!-- 地图手绘涂鸦滤镜定义（赛段为空时不参与渲染，保留以备后续添加赛段） -->
  <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="rough2">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13" result="n2"/>
        <feDisplacementMap in="SourceGraphic" in2="n2" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <header class="site-header">
    <div class="brand">
      <h1>Vancouver KOM</h1>
    </div>
  </header>

  <div id="status" class="status-bar" style="display:none"></div>

  <main class="layout">
    <section class="map-wrap">
      <div id="map"></div>
      <div id="map-overlay" class="map-overlay">地图加载中…</div>
      <div class="legend">
        <span><i class="arrow" style="background:#1d3461"></i>风向流场（海军蓝线越长越密＝风越大、越顺）</span>
      </div>
    </section>

  <aside class="sidebar">
    <!-- 赛段浏览 / 查询（添加赛段后生效） -->
    <div class="card" id="browser-card">
      <h3>赛段浏览 / 查询</h3>
      <input id="seg-search" type="text" placeholder="搜索赛段名称…" />
      <div class="seg-filters" id="seg-filters">
        <button data-diff="all" class="active">全部</button>
        <button data-diff="easy">轻松</button>
        <button data-diff="moderate">中等</button>
        <button data-diff="hard">困难</button>
        <button data-diff="expert">专家</button>
      </div>
      <div id="seg-list" class="rec-list"></div>
    </div>

    <!-- 当前风向（始终展示，无需登录） -->
    <div id="wind-card" class="card"></div>

    <!-- 未来几小时 KOM 推荐（始终展示，无需登录；添加赛段后生效） -->
    <div class="card">
      <h3>未来几小时 KOM 推荐</h3>
      <div id="rec-list" class="rec-list"></div>
    </div>

    <div id="detail-card" class="card" style="display:none"></div>
    <p class="muted small">判定逻辑：仅当为顺风（方向吻合且风速为正）才对冲击 KOM 有积极影响；方向越吻合、风速越大，概率越高。风向数据来自 Open-Meteo，屏幕上的海军蓝流场实时反映风向风速。赛段为静态数据，你可在 <code>data/vancouver-segments.json</code> 中自行添加。</p>
  </aside>
  </main>

  <footer class="site-footer">
    <p>风向数据：Open-Meteo（免费）· 地图：OpenStreetMap · 赛段：可自行在本地数据文件中添加</p>
  </footer>

  <script src="vendor/leaflet/leaflet.js?v=20260810092927"></script>
  <script type="module" src="js/app.js?v=20260810092927"></script>
</body>
</html>
